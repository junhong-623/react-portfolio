<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0d14" id="theme-color-meta" />
    <title>DevPortfolio</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #0d0d14; }

      /* ── Splash screen — visible immediately, before React loads ── */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0d0d14;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 28px;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.hidden { opacity: 0; visibility: hidden; }

      #splash-logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 800; font-size: 28px;
        color: #8b7cf8; letter-spacing: -1px;
      }

      #splash-spinner {
        width: 40px; height: 40px;
        border: 3px solid #2a2a42;
        border-top-color: #8b7cf8;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }

      #splash-dots {
        display: flex; gap: 8px;
      }
      #splash-dots span {
        width: 7px; height: 7px; border-radius: 50%;
        background: #2a2a42;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes splash-spin  { to { transform: rotate(360deg); } }
      @keyframes splash-pulse {
        0%, 100% { background: #2a2a42; transform: scale(1);   }
        50%       { background: #8b7cf8; transform: scale(1.3); }
      }
    </style>
  </head>
  <body>
    <!-- Splash: shown instantly, hidden once React mounts -->
    <div id="splash">
      <div id="splash-logo">DevPortfolio</div>
      <div id="splash-spinner"></div>
      <div id="splash-dots"><span></span><span></span><span></span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
